services:
  - type: web
    name: exam-integrity-server
    runtime: node
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromSecret:
          name: neon-database-url
      - key: JWT_SECRET
        fromSecret:
          name: jwt-secret
      - key: NODE_ENV
        value: production

staticSites:
  - name: exam-integrity-client
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
