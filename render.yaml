services:
  - type: web
    name: exam-integrity-server
    runtime: node
    buildCommand: "cd server && npm install && npm run build"
    startCommand: "cd server && npm start"
    envVars:
      - key: DATABASE_URL
        value: dummy-value-will-override-in-ui
      - key: JWT_SECRET
        value: dummy-value-will-override-in-ui
      - key: NODE_ENV
        value: production

  - type: web
    name: exam-integrity-client
    runtime: node
    buildCommand: "cd client && npm install && npm run build"
    startCommand: "cd client && npm run start"
