services:
  - type: web
    name: exam-integrity-server
    runtime: node
    instanceType: free
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production

  - type: web
    name: exam-integrity-client
    runtime: node
    instanceType: free
    rootDir: client
    buildCommand: npm install && npm run build
    startCommand: npm run start
