services:
  - type: web
    name: exam-integrity-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: NODE_ENV
        value: production
      - key: PUBLIC_API_URL
        value: https://exam-integrity-server.onrender.com
      - key: CLIENT_URL
        value: https://exam-integrity-client.onrender.com
      - key: LTI_CONSUMER_KEY
        sync: false
      - key: LTI_SHARED_SECRET
        sync: false
  - type: web
    name: exam-integrity-client
    runtime: node
    plan: free
    rootDir: client
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    envVars:
      - key: VITE_API_BASE_URL
        value: https://exam-integrity-server.onrender.com
